name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web files (libraries saved inside the app, works offline)
        run: |
          mkdir -p www/lib assets
          cp index.html www/
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js -o www/lib/d3.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js -o www/lib/topojson.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js -o www/lib/datamaps.world.min.js
          cp icon-only.png icon-foreground.png icon-background.png assets/
      - name: Add Android and icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: World-Time-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
